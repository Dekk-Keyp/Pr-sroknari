<!DOCTYPE html>
<html lang="fo">
<head>
<meta charset="UTF-8">
<title>Dekk Prisroknari</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;min-height:100vh;padding:24px}
.card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:28px;max-width:860px;margin:0 auto}
.db-badge{font-size:12px;color:#16a34a;margin-bottom:20px}
.sl{font-size:11px;color:#999;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
label{font-size:13px;color:#555;display:block;margin-bottom:4px}
input,select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;background:#fff}
input:focus,select:focus{border-color:#555}
.ean-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:6px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px;align-items:end}
.btn{height:38px;padding:0 18px;background:#f0f0f0;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:14px;color:#111;white-space:nowrap}
.btn:hover{background:#e5e5e5}
.bp{background:#111;color:#fff;border-color:#111}
.bp:hover{background:#333}
.status{font-size:12px;margin:4px 0 10px;min-height:16px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;margin-right:4px}
.bok{background:#dcfce7;color:#15803d}
.berr{background:#fee2e2;color:#dc2626}
.found-box{background:#f9f9f9;border-radius:8px;padding:10px 14px;margin:8px 0 14px;display:none;gap:24px;flex-wrap:wrap;border:1px solid #eee}
.found-box.show{display:flex}
.fi{font-size:13px;color:#666}
.fi strong{display:block;font-size:14px;font-weight:500;color:#111;margin-top:2px}
.pv{background:#f9f9f9;border-radius:8px;padding:12px 16px;margin:14px 0;display:flex;gap:24px;flex-wrap:wrap;border:1px solid #eee}
.ci{font-size:12px;color:#666}
.ci strong{display:block;font-size:15px;font-weight:600;color:#111;margin-top:2px}
.divl{border:none;border-top:1px solid #eee;margin:22px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:11px;color:#999;border-bottom:1px solid #eee;text-transform:uppercase;letter-spacing:.05em}
th:not(:first-child){text-align:right}
td{padding:11px 12px;border-bottom:1px solid #f5f5f5;color:#111}
td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.delbtn{background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;line-height:1;padding:0 4px}
.delbtn:hover{color:#dc2626}
.empty{text-align:center;padding:28px;color:#bbb;font-style:italic;font-size:13px}
.notice{font-size:12px;color:#aaa;margin-top:14px;font-style:italic}
.cpsec{margin-top:20px;display:none}
.cphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cpbox{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:16px}
.qprev{font-size:13px;line-height:1.8;white-space:pre;font-family:ui-monospace,monospace;color:#333;overflow-x:auto;margin-top:12px}
</style>
</head>

const AV={13:175,14:175,15:175,16:200,17:275,18:300,19:325,20:350,21:400,22:450};
const GE=7.5,FR=250,TO=1.045,AG=7.5,MV=1.25;
const DROP=new Set(["XL","MFS","RFT","RF","AO","MO","MOE","FP","FSL","SLT","RE0","EXT","DOT21","DOT22","DOT23","DOT24","DOT25","DOT26"]);
document.getElementById("dbb").textContent=Object.keys(DB).length.toLocaleString("da-DK")+" dekk i goymslulista";
function tc(s){return s.split(" ").map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(" ");}
function cm(tokens){
  while(tokens.length&&(DROP.has(tokens[tokens.length-1].toUpperCase())||/^DOT[0-9]/.test(tokens[tokens.length-1])||/^\W+$/.test(tokens[tokens.length-1]))){tokens.pop();}
  return tokens.join(" ").replace(/-/g," ").toUpperCase();
}
function fmtName(brand,item){
  var bt=tc(brand);
  if(item.includes(" TL ")){
    var i=item.indexOf(" TL ");
    return bt+" "+cm(item.slice(i+4).trim().split(/\s+/))+" "+item.slice(0,i);
  }
  var m=item.match(/^(\d{3}\/\d{2,3}[A-Z]+\s+\d{2}\s+\d{2,3}[A-Z])\s+(.*)/);
  if(m) return bt+" "+cm(m[2].trim().split(/\s+/))+" "+m[1];
  return bt+" "+item;
}
function parseSpec(item){
  var m1=item.match(/\d{3}\/\d{2,3}[A-Z]+\s+(\d{2})/);
  var m2=item.match(/\s(\d{2,3})([A-Z])(?:\s|TL)/);
  return{rim:m1?parseInt(m1[1]):null,li:m2?m2[1]:null,sf:m2?m2[2]:null};
}
function fi(n){return Math.round(n).toLocaleString("da-DK");}
function f2(n){return n.toLocaleString("da-DK",{minimumFractionDigits:2,maximumFractionDigits:2});}
function rokna(eur,rim){
  var frakt=eur*GE+FR;
  var toll=frakt*TO+AG;
  var av=AV[rim]||325;
  var mvg=Math.ceil((toll+av)*MV/10)*10;
  return{frakt:frakt,toll:toll,av:av,utan:mvg/MV,mvg:mvg};
}
function upd(){
  var eur=parseFloat(document.getElementById("eur").value);
  var rim=parseInt(document.getElementById("tummar").value);
  if(!eur||eur<=0){["pf","pt","pa","pu","pm"].forEach(function(id){document.getElementById(id).textContent="-";});return;}
  var r=rokna(eur,rim);
  document.getElementById("pf").textContent=f2(r.frakt)+" kr.";
  document.getElementById("pt").textContent=f2(r.toll)+" kr.";
  document.getElementById("pa").textContent=fi(r.av)+" kr.";
  document.getElementById("pu").textContent=fi(r.utan)+" kr.";
  document.getElementById("pm").textContent=fi(r.mvg)+" kr.";
}
function setSts(msg,cls,badge){
  var el=document.getElementById("sts");
  if(badge){var b=badge==="ok"?"bok":"berr",t=badge==="ok"?"I goymslulista":"Ikki i goymslulista";el.innerHTML='<span class="badge '+b+'">'+t+"</span>"+msg;}
  else el.textContent=msg;
  el.className="status "+cls;
}
function lookupEAN(){
  var ean=document.getElementById("ean").value.trim();
  if(!ean||ean.length<8){setSts("Skriva inn EAN-nummar","");return;}
  document.getElementById("fb").classList.remove("show");
  var hit=DB[ean];
  if(hit){
    var name=fmtName(hit[0],hit[1]),sp=parseSpec(hit[1]);
    document.getElementById("merki").value=name;
    document.getElementById("fm").textContent=name;
    document.getElementById("fl").textContent=sp.li||"-";
    document.getElementById("fs").textContent=sp.sf||"-";
    if(sp.rim&&sp.rim>=13&&sp.rim<=22)document.getElementById("tummar").value=sp.rim;
    document.getElementById("fb").classList.add("show");
    setSts("","","ok");
    upd();
  } else {
    setSts("","","err");
    document.getElementById("merki").focus();
  }
}
document.getElementById("ean").addEventListener("keydown",function(e){if(e.key==="Enter")lookupEAN();});
document.getElementById("ean").addEventListener("input",function(){
  var v=this.value.trim();
  if(v.length===13||v.length===8)lookupEAN();
});
document.getElementById("eur").addEventListener("input",upd);
document.getElementById("tummar").addEventListener("change",upd);
var items=[];
function render(){
  var b=document.getElementById("qb");
  if(!items.length){b.innerHTML='<tr><td colspan="4" class="empty">Ongi dekk enn lagt til</td></tr>';document.getElementById("cpsec").style.display="none";return;}
  var sorted=items.slice().sort(function(a,b){
    var ba=a.n.split(" ")[0],bb=b.n.split(" ")[0];
    if(ba!==bb){
      var minA=Math.min.apply(null,items.filter(function(x){return x.n.split(" ")[0]===ba;}).map(function(x){return x.m;}));
      var minB=Math.min.apply(null,items.filter(function(x){return x.n.split(" ")[0]===bb;}).map(function(x){return x.m;}));
      return minA-minB;
    }
    return a.m-b.m;
  });
  b.innerHTML=sorted.map(function(it){return'<tr><td>'+it.n+'</td><td style="text-align:right;padding:8px 12px">'+fi(it.u)+' kr.</td><td style="text-align:right;padding:8px 12px">'+fi(it.m)+' kr.</td><td><button class="delbtn" data-n="'+it.n.replace(/"/g,"&quot;")+'">x</button></td></tr>';}).join("");
  b.querySelectorAll(".delbtn").forEach(function(btn){
    btn.addEventListener("click",function(){
      var n=this.getAttribute("data-n");
      items=items.filter(function(it){return it.n!==n;});
      render();
    });
  });
  var col=Math.max(30,Math.max.apply(null,sorted.map(function(it){return it.n.length;})));
  var h1="Merki".padEnd(col+3),h2="Prisur pr. dekk".padStart(16),h3="Prisur pr. dekk v/mvg".padStart(22);
  var rows=sorted.map(function(it){return it.n.padEnd(col+3)+fi(it.u).padStart(16)+fi(it.m).padStart(22);}).join("\n");
  document.getElementById("qprev").textContent=h1+h2+h3+"\n"+"-".repeat(col+41)+"\n"+rows+"\n\nPr\xedsir eru galdandi so leingi dekkini eru t\xf8k \xe1 fjargoymslu.";
  document.getElementById("cpsec").style.display="block";
}
function copyQuote(){
  var text=document.getElementById("qprev").textContent;
  var btn=document.getElementById("cpbtn");
  function ok(){btn.textContent="Kopierad!";btn.style.color="#16a34a";setTimeout(function(){btn.textContent="Kopiera";btn.style.color="";},2000);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(function(){fallback(text,ok);});}
  else fallback(text,ok);
}
function fallback(text,cb){
  var ta=document.createElement("textarea");
  ta.value=text;ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");cb();}catch(e){}
  document.body.removeChild(ta);
}
function addDekk(){
  var merki=document.getElementById("merki").value.trim();
  var eur=parseFloat(document.getElementById("eur").value);
  var rim=parseInt(document.getElementById("tummar").value);
  if(!merki||!eur||eur<=0){alert("Fyll inn merki og innkeypsprisur.");return;}
  var r=rokna(eur,rim);
  items.push({n:merki,u:r.utan,m:r.mvg});
  render();
  ["merki","eur","ean"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("fb").classList.remove("show");
  setSts("");upd();
}
